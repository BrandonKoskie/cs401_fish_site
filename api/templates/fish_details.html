<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ fish.common_name }} - Hawaii Seafood Guide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-image { height: 400px; object-fit: cover; border-radius: 15px; }
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Hawaii Seafood Guide</a>
            <a class="nav-link text-light" href="/fish">← Back to All Fish</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-6">
                <img src="{{ fish.image_url }}" class="hero-image img-fluid shadow" alt="{{ fish.common_name }}">
            </div>
            <div class="col-lg-6">
                <h1 class="display-5">{{ fish.common_name }}</h1>
                <h5 class="text-muted">{{ fish.hawaiian_name }} ({{ fish.scientific_name }})</h5>
                
                <span class="badge bg-success fs-5 mb-3">{{ fish.sustainability_rating }}</span>
                
                <h5 class="mt-4">Health Notes</h5>
                <p>{{ fish.health_notes }}</p>
                
                <h5>Preparation Tips</h5>
                <p>{{ fish.preparation }}</p>
                
                <h5>Description</h5>
                <p>{{ fish.description }}</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
